name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make autoconf automake libtool pkg-config

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (ReleaseSmall)
        run: zig build -Doptimize=ReleaseSmall --summary all

      - name: Stage stripped binary
        run: |
          install -m 0755 zig-out/bin/qcore qcore
          strip qcore
          asset="qcore-${GITHUB_REF_NAME}-x86_64-linux"
          mv qcore "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"

      - name: Build release notes from CHANGELOG
        run: |
          notes="$(.github/scripts/extract-changelog.sh "$GITHUB_REF_NAME" || true)"
          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" > release-notes.md
            echo "notes_flag=--notes-file release-notes.md" >> "$GITHUB_ENV"
            echo "Using CHANGELOG.md section for $GITHUB_REF_NAME"
          else
            echo "notes_flag=--generate-notes" >> "$GITHUB_ENV"
            echo "::warning::No CHANGELOG.md section for $GITHUB_REF_NAME; falling back to auto-generated notes"
          fi

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            $notes_flag \
            "$asset" "$asset.sha256"
